spring.application.name=livecoding-simulator

# ---------- Banco H2 em memoria (perfil padrao / dev) ----------
spring.datasource.url=jdbc:h2:mem:livecoding;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:livecoding)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Servidor ----------
server.port=8080

# Erros de validacao com corpo detalhado
server.error.include-message=always

# ---------- JWT ----------
# Chave de DESENVOLVIMENTO. Em producao defina JWT_SECRET (base64, 256 bits) como variavel de ambiente.
app.jwt.secret=${JWT_SECRET:StxWKmYGKpMlZjNZz21Vh/gT1sxWNtdQevlKdd2oEyk=}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:3600000}

# ---------- CORS ----------
# Origens do frontend (Vite em dev). Lista separada por virgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
