spring.application.name=livecoding-simulator

# ---------- Banco H2 em memoria (perfil padrao / dev) ----------
spring.datasource.url=jdbc:h2:mem:livecoding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:livecoding)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# Schema e catalogo tem uma fonte de verdade unica: as migrations do Flyway. O H2 roda em
# MODE=PostgreSQL justamente para aceitar o mesmo SQL do banco de producao, entao dev, pg e prod
# aplicam exatamente os mesmos scripts. O Hibernate so confere o resultado.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Servidor ----------
server.port=8080

# Erros de validacao com corpo detalhado. Vale so em dev: o perfil prod sobrescreve para never,
# porque a mensagem crua da excecao pode expor SQL, caminho de classe e nomes internos.
server.error.include-message=always

# ---------- JWT ----------
# Chave de DESENVOLVIMENTO. Em producao defina JWT_SECRET (base64, 256 bits) como variavel de ambiente.
app.jwt.secret=${JWT_SECRET:StxWKmYGKpMlZjNZz21Vh/gT1sxWNtdQevlKdd2oEyk=}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:3600000}

# ---------- Admin ----------
# Conta de admin criada no boot pelo AdminBootstrap. Estes valores sao de DESENVOLVIMENTO.
# Em producao o perfil prod nao traz default: sem ADMIN_EMAIL e ADMIN_SENHA, nenhum admin nasce.
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@livecoding.dev}
app.admin.senha=${ADMIN_SENHA:admin12345}

# ---------- CORS ----------
# Origens do frontend (Vite em dev). Lista separada por virgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
