# Perfil PostgreSQL: rodar com --spring.profiles.active=prod
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livecoding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema e criado pelas migrations do Flyway; o Hibernate apenas confere se bate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Nunca devolver a mensagem interna da excecao ao cliente: o GlobalExceptionHandler
# ja monta um corpo proprio para os erros previstos.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.h2.console.enabled=false

# JWT: sem default. JWT_SECRET e obrigatoria em producao e a aplicacao nao sobe sem ela.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:3600000}

# CORS: em producao defina CORS_ALLOWED_ORIGINS com o dominio real do frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
