# Perfil PostgreSQL: rodar com --spring.profiles.active=prod
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livecoding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# JWT: sem default. JWT_SECRET e obrigatoria em producao e a aplicacao nao sobe sem ela.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:3600000}
