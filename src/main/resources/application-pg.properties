# Perfil de desenvolvimento com PostgreSQL local: rodar com --spring.profiles.active=pg
# Diferente do perfil prod, aqui o DataLoader continua ativo e popula o banco na primeira subida.
# O schema vem das migrations do Flyway (db/migration), entao as tabelas ficam gravadas em disco.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:8090/livecoding}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false
